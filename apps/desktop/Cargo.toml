[package]
name = "nexttouch"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "NextTouch desktop app (Windows x86_64 + arm64, Linux) — egui shell over the shared catalog/core"

[dependencies]
nexttouch-catalog = { path = "../../crates/nexttouch-catalog" }
nexttouch-core = { path = "../../crates/nexttouch-core" }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
