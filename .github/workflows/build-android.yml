# NextTouch — Android builds (arm64-v8a + x86_64 split APKs)
# Copyright (c) 2026 c12n Apps — GPL-2.0-or-later
name: build-android

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - "android/**"
      - "crates/nexttouch-catalog/assets/catalog.json"
      - ".github/workflows/build-android.yml"

jobs:
  build:
    name: android-apks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # The release APK is unsigned in CI (no signing secrets in the
      # repo); it is signed on release the same way the project's other
      # Android artifacts are. Debug builds are self-signed by Gradle.
      - name: Build release APKs (ABI splits)
        working-directory: android
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Collect + verify APKs
        run: |
          set -euo pipefail
          mkdir -p out
          find android/app/build/outputs/apk/release -name "*.apk" -print
          for apk in android/app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            case "$base" in
              *arm64-v8a*) cp "$apk" "out/NextTouch-android-arm64-v8a.apk" ;;
              *x86_64*)    cp "$apk" "out/NextTouch-android-x86_64.apk" ;;
              *) echo "unexpected APK name: $base" ;;
            esac
          done
          ls -la out
          test -f out/NextTouch-android-arm64-v8a.apk
          test -f out/NextTouch-android-x86_64.apk
          sha256sum out/*.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NextTouch-android
          path: out/*.apk
          if-no-files-found: error
