# NextTouch — iOS build (unsigned arm64 IPA, sideload-only)
# Copyright (c) 2026 c12n Apps — GPL-2.0-or-later
name: build-ios

on:
  workflow_dispatch:
  workflow_call:
  push:
    paths:
      - "ios/**"
      - "crates/nexttouch-catalog/assets/catalog.json"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    name: ios-ipa
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version

      - name: Verify project parses
        run: |
          plutil -lint ios/NextTouch/Info.plist ios/NextTouch/NextTouch.entitlements ios/NextTouch/PrivacyInfo.xcprivacy
          xcodebuild -list -project ios/NextTouch.xcodeproj

      - name: Build (unsigned, arm64, iOS 17+)
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/NextTouch.xcodeproj \
            -scheme NextTouch \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP=$(find build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -1)
          echo "app: $APP"
          test -n "$APP"
          # The IPA must be arm64-only and carry 0.1.0 / com.c12n.nexttouch.
          BIN="$APP/NextTouch"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q "arm64"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          mkdir -p Payload
          cp -R "$APP" Payload/
          # Sideload convention: no embedded provisioning profile, no
          # _CodeSignature content from CI (the user's signer re-signs
          # with their development certificate — JIT needs get-task-allow).
          rm -f Payload/NextTouch.app/embedded.mobileprovision
          zip -qry NextTouch.ipa Payload
          ls -la NextTouch.ipa
          shasum -a 256 NextTouch.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: NextTouch-ios
          path: NextTouch.ipa
          if-no-files-found: error
